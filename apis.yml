aid: mosa-meat
name: Mosa Meat
description: 'Mosa Meat is a European food technology company headquartered in Maastricht,
  the Netherlands, founded in 2016 as a spin-off of Maastricht University by Mark Post
  and Peter Verstrate. The company develops cultivated (cell-cultured) beef using cellular
  agriculture: a small cell sample taken from a cow is nurtured through natural processes
  into muscle and fat tissue, which the company states can yield up to 80,000 burgers
  from a single sample. Mosa Meat produced the world''s first cultured beef hamburger
  in 2013 and now operates the Mosa C.A.M.P.U.S. (Center for Advanced Meat Production,
  Upscaling, and Sustainability) in Maastricht, reported as the largest cultivated meat
  campus in the world. It is a B Corp certified organization pursuing regulatory approval
  and market entry for cultivated beef burgers. Mosa Meat is a laboratory and food
  production business; it publishes no developer program, public API, or machine-readable
  API contract.'
